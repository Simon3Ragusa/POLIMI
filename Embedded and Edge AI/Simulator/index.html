<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EEAI Exam Simulator | 2026 Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.2);
            --accent: #f59e0b;
            --bg: #fdfeff;
            --surface: #ffffff;
            --text: #0f172a;
            --text-dim: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --radius: 24px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                              radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                              radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-attachment: fixed;
            color: var(--text);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .navbar {
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.7);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo { font-weight: 800; font-size: 1.2rem; color: var(--text); display: flex; align-items: center; gap: 8px; }
        
        .timer-badge {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            padding: 8px 16px;
            border-radius: 99px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .container { max-width: 900px; margin: 3rem auto; padding: 0 1.5rem; }

        .hero { text-align: center; margin-bottom: 4rem; color: white; }
        .hero h1 { font-size: 3.5rem; font-weight: 800; margin: 0; letter-spacing: -2px; }
        .hero p { opacity: 0.8; font-size: 1.1rem; }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: var(--radius);
            padding: 2.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .section-tag {
            background: var(--primary-glow);
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            display: inline-block;
        }

        .question-text { font-size: 1.4rem; font-weight: 700; margin-bottom: 2rem; display: block; }

        .options-grid { display: flex; flex-direction: column; gap: 1rem; }
        
        .option-pill {
            background: #f8fafc;
            border: 2px solid transparent;
            padding: 1.2rem 1.5rem;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.2s;
            font-weight: 600;
        }

        .option-pill:hover { background: #f1f5f9; transform: translateX(8px); }
        .option-pill.selected { border-color: var(--primary); background: var(--primary-glow); }
        .option-pill.correct { background: #ecfdf5 !important; border-color: var(--success) !important; color: #065f46 !important; }
        .option-pill.wrong { background: #fef2f2 !important; border-color: var(--danger) !important; color: #991b1b !important; }

        .idx-circle {
            width: 32px; height: 32px; border-radius: 50%; background: #e2e8f0; 
            display: flex; align-items: center; justify-content: center; font-size: 0.8rem;
        }
        .selected .idx-circle { background: var(--primary); color: white; }

        textarea {
            width: 100%; min-height: 180px; border-radius: var(--radius); border: 2px solid #e2e8f0;
            padding: 1.5rem; font-family: inherit; font-size: 1rem; transition: all 0.2s;
        }
        textarea:focus { outline: none; border-color: var(--primary); background: #fdf2ff; }

        .result-panel {
            display: none; text-align: center; padding: 3rem; background: var(--primary); color: white;
            border-radius: var(--radius); margin-bottom: 3rem;
        }
        .score-num { font-size: 5rem; font-weight: 800; }

        .btn-group { display: flex; flex-direction: column; gap: 1rem; align-items: center; margin: 4rem auto; }

        .cta-btn {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white; border: none; padding: 1.2rem 3rem; border-radius: 99px;
            font-size: 1.2rem; font-weight: 800; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
        }
        .cta-btn:hover { transform: scale(1.05); box-shadow: 0 15px 40px rgba(99, 102, 241, 0.6); }
        .cta-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .secondary-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white; border: 2px solid white; padding: 1rem 2.5rem; border-radius: 99px;
            font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.2s;
            display: none;
        }
        .secondary-btn:hover { background: white; color: var(--primary); }

        .explanation { display: none; margin-top: 1.5rem; font-size: 0.95rem; color: var(--text-dim); padding: 1rem; background: #f8fafc; border-radius: 12px; }

        @media (max-width: 640px) {
            .hero h1 { font-size: 2.2rem; }
            .glass-card { padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">🚀 EEAI Simulator <span style="font-size: 0.7rem; opacity: 0.5;">v4.1</span></div>
        <div id="timer" class="timer-badge">30:00</div>
    </nav>

    <div class="container">
        <div class="hero">
            <h1>Elite Training</h1>
            <p>Class Simulation | Embedded and Edge AI 2026</p>
        </div>

        <div id="result-panel" class="result-panel">
            <p style="font-weight: 700; margin: 0; opacity: 0.8;">FINAL SCORE</p>
            <div class="score-num" id="final-score">0 / 30</div>
            <p id="grade-comment" style="font-size: 1.2rem; font-weight: 600;"></p>
        </div>

        <form id="exam-form">
            <div id="questions-area"></div>
            
            <div class="btn-group">
                <button type="button" class="cta-btn" id="submit-btn" onclick="submitExam()">SUBMIT FOR GRADING</button>
                <button type="button" class="secondary-btn" id="restart-btn" onclick="restartExam()">RESTART NEW EXAM</button>
            </div>
        </form>
    </div>

    <script>
        const closedPool = [
            { q: "Which instruction set handles SIMD acceleration on the ESP32-S3?", o: ["ULP-RV", "Xtensa PIE", "ESP-NN", "ARM Neon"], a: 1, e: "PIE (Power-efficient Instruction Extensions) is the custom SIMD set on the ESP32-S3." },
            { q: "What's the 'Fire Module' config in SqueezeNet?", o: ["Conv -> MaxPool", "Squeeze (1x1) then Expand (1x1 & 3x3)", "Depthwise then Pointwise", "Inverted Residual with ReLU6"], a: 1, e: "SqueezeNet uses a 1x1 squeeze layer followed by concatenated 1x1 and 3x3 expand layers." },
            { q: "Zero-Point (Z) mapping in Asymmetric Quantization?", o: ["Maps real 0.0 to integer value", "Maps weights to mean 0", "Static bias for all layers", "Floating point scaling factor"], a: 0, e: "Zero-point is the integer representation of the floating-point value 0.0." },
            { q: "How to minimize activation SRAM footprint?", o: ["Weight pruning", "Quantize activations to INT8", "Disable bias", "Flash weights storage"], a: 1, e: "INT8 activations consume 4x less SRAM than Float32." },
            { q: "Inverted Residual block (MobileNetV2)?", o: ["Reduce channels then filter", "Expand channels then filter", "Single 5x5 filter", "Always use skip connection"], a: 1, e: "Inverted residuals expand depth before applying a depthwise convolution." },
            { q: "Early Exit trigger metric?", o: ["Latency timer", "Confidence (e.g. Entropy)", "Battery level", "Kernel size"], a: 1, e: "Exit is triggered when the model is 'confident' enough (low entropy)." },
            { q: "Why use Static PTQ over Dynamic?", o: ["No data needed", "Faster inference (no on-the-fly scaling)", "Better accuracy", "Smaller model size"], a: 1, e: "Static PTQ pre-calculates scaling factors, saving CPU cycles during inference." },
            { q: "Hardware-Aware search in Edge AI?", o: ["Finding cheap MCUs", "Architecture optimization for target constraints", "GPU-only training", "Cloud pruning"], a: 1, e: "Optimizing the model specifically for target hardware (MACs/SRAM)." },
            { q: "Most MAC-intensive layer in Depthwise Separable?", o: ["Depthwise", "Pointwise (1x1)", "BN", "ReLU"], a: 1, e: "Pointwise layers often account for >90% of total MACs." },
            { q: "Layer Fusion (ESP-DL)?", o: ["Weight merging", "Kernel op combination (Conv+Bias+ReLU)", "Multi-core sync", "Model compression"], a: 1, e: "Combining operations reduces memory bandwidth overhead." }
        ];

        const openPool = [
            { q: "MAC CALC: 32x32x32 Input, 3x3 Depthwise (S1), 64 Pointwise filters. Show total.", a: "Depthwise: (3*3*1)*(30*30*32) = 259,200. Pointwise: (1*1*32)*(30*30*64) = 1,843,200. Total = 2,102,400 MACs.", pts: 5 },
            { q: "THEORY: Why 32-bit Bias in 8-bit networks?", a: "To match the precision of the accumulator and avoid rounding errors during sum-product operations.", pts: 5 },
            { q: "DESIGN: Strategy to fit a 2MB model in 512KB SRAM?", a: "1. INT8 Quantization. 2. Layer Streaming/Tiling. 3. Depthwise Separable refactoring.", pts: 5 }
        ];

        let timeLeft = 30 * 60;
        let timerInterval;
        let userClosed = new Array(10).fill(null);
        let currentClosed = [], currentOpen = [];

        function init() {
            clearInterval(timerInterval);
            timeLeft = 30 * 60;
            userClosed = new Array(10).fill(null);
            document.getElementById('submit-btn').disabled = false;
            document.getElementById('restart-btn').style.display = 'none';
            document.getElementById('result-panel').style.display = 'none';
            
            currentClosed = [...closedPool].sort(() => Math.random() - 0.5).slice(0, 10);
            currentOpen = [...openPool].sort(() => Math.random() - 0.5).slice(0, 3);
            
            const area = document.getElementById('questions-area');
            area.innerHTML = '';

            currentClosed.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'glass-card';
                card.innerHTML = `
                    <span class="section-tag">Question ${idx+1} / 13</span>
                    <span class="question-text">${item.q}</span>
                    <div class="options-grid" id="opt-group-${idx}">
                        ${item.o.map((o, i) => `
                            <div class="option-pill" onclick="select(${idx}, ${i})">
                                <div class="idx-circle">${String.fromCharCode(65+i)}</div>
                                <span>${o}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="explanation" id="feed-${idx}"><strong>Key Concept:</strong> ${item.e}</div>
                `;
                area.appendChild(card);
            });

            currentOpen.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'glass-card';
                card.innerHTML = `
                    <span class="section-tag">Technical Challenge Q${idx+11}</span>
                    <span class="question-text">${item.q}</span>
                    <textarea placeholder="Type your derivation or strategy here..." id="open-text-${idx}"></textarea>
                    <div class="explanation" id="open-feed-${idx}"><strong>Reference Solution:</strong><br>${item.a}</div>
                `;
                area.appendChild(card);
            });

            startTimer();
        }

        function startTimer() {
            const timerEl = document.getElementById('timer');
            timerInterval = setInterval(() => {
                let m = Math.floor(timeLeft / 60), s = timeLeft % 60;
                timerEl.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                if (timeLeft <= 0) { clearInterval(timerInterval); submitExam(); }
                timeLeft--;
            }, 1000);
        }

        window.select = (qIdx, oIdx) => {
            if (document.getElementById('submit-btn').disabled) return;
            userClosed[qIdx] = oIdx;
            const pills = document.querySelectorAll(`#opt-group-${qIdx} .option-pill`);
            pills.forEach((p, i) => p.classList.toggle('selected', i === oIdx));
        };

        window.restartExam = () => {
            init();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.submitExam = () => {
            clearInterval(timerInterval);
            document.getElementById('submit-btn').disabled = true;
            document.getElementById('restart-btn').style.display = 'block';
            
            let score = 0;
            currentClosed.forEach((item, idx) => {
                const pills = document.querySelectorAll(`#opt-group-${idx} .option-pill`);
                document.getElementById(`feed-${idx}`).style.display = 'block';
                if (userClosed[idx] === item.a) { 
                    score += 1.5; 
                    pills[item.a].classList.add('correct'); 
                }
                else { 
                    if (userClosed[idx] !== null) pills[userClosed[idx]].classList.add('wrong'); 
                    pills[item.a].classList.add('correct'); 
                }
            });

            // FIXED SCORING: No automatic base score. Open questions show feedback for self-grading.
            currentOpen.forEach((_, idx) => document.getElementById(`open-feed-${idx}`).style.display = 'block');

            // Note: In a real exam, open questions are worth 15 points. Here we just show the closed score.
            // But to avoid the "12.5" issue, we only show what the user actually earned in the MCQ.
            const final = score; 
            document.getElementById('result-panel').style.display = 'block';
            document.getElementById('final-score').innerText = `${final} / 15 (Part 1 Only)`;
            document.getElementById('grade-comment').innerText = "Review Part 2 solutions manually to estimate your total grade.";
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        init();
    </script>
</body>
</html>
