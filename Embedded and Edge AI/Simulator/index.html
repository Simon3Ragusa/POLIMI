<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EEAI Exam Simulator | 2026 Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.15);
            --bg: #f8fafc;
            --text: #0f172a;
            --text-dim: #475569;
            --success: #059669;
            --danger: #dc2626;
            --radius: 16px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 0;
            padding-bottom: 80px; /* Space for mobile scrolling */
        }

        .navbar {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e2e8f0;
            padding: 1rem;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000;
        }

        .logo { font-weight: 800; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
        
        .timer-badge {
            background: #fee2e2; color: var(--danger);
            padding: 6px 12px; border-radius: 99px;
            font-weight: 700; font-variant-numeric: tabular-nums;
            font-size: 0.9rem;
        }

        .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }

        .hero { text-align: center; margin-bottom: 3rem; }
        .hero h1 { font-size: 2.2rem; font-weight: 800; margin: 0 0 0.5rem 0; color: #1e293b; }
        .hero p { color: var(--text-dim); margin: 0; font-size: 1rem; }

        .glass-card {
            background: #ffffff; border-radius: var(--radius);
            padding: 1.5rem; margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }

        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;
        }

        .section-tag {
            background: var(--primary-glow); color: var(--primary);
            padding: 4px 12px; border-radius: 8px;
            font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
        }

        .points-tag {
            font-size: 0.8rem; font-weight: 600; color: var(--text-dim);
            background: #f1f5f9; padding: 4px 8px; border-radius: 6px;
        }

        .question-text { font-size: 1.15rem; font-weight: 700; margin-bottom: 1.5rem; display: block; line-height: 1.5; }

        .options-grid { display: flex; flex-direction: column; gap: 0.75rem; }
        
        .option-pill {
            background: #f8fafc; border: 2px solid transparent;
            padding: 1rem; border-radius: 12px;
            cursor: pointer; display: flex; align-items: flex-start; gap: 1rem;
            transition: all 0.2s; font-weight: 600; font-size: 0.95rem; line-height: 1.4;
        }

        .option-pill:hover { background: #f1f5f9; }
        .option-pill.selected { border-color: var(--primary); background: #e0e7ff; }
        .option-pill.correct { background: #d1fae5 !important; border-color: var(--success) !important; color: #064e3b !important; }
        .option-pill.wrong { background: #fee2e2 !important; border-color: var(--danger) !important; color: #7f1d1d !important; }

        .idx-circle {
            width: 28px; height: 28px; border-radius: 50%; background: #e2e8f0; 
            display: flex; align-items: center; justify-content: center; font-size: 0.8rem; flex-shrink: 0;
        }
        .selected .idx-circle { background: var(--primary); color: white; }

        textarea {
            width: 100%; min-height: 120px; border-radius: 12px; border: 2px solid #e2e8f0;
            padding: 1rem; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.95rem; 
            transition: border-color 0.2s; resize: vertical;
        }
        textarea:focus { outline: none; border-color: var(--primary); }

        .explanation { 
            display: none; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-dim); 
            padding: 1rem; background: #f1f5f9; border-radius: 12px; border-left: 4px solid var(--primary);
        }
        
        .source-chip {
            display: inline-block; margin-top: 10px; font-size: 0.75rem; font-weight: 600;
            background: #e2e8f0; color: #475569; padding: 4px 8px; border-radius: 4px;
        }

        .result-panel {
            display: none; text-align: center; padding: 2rem; background: var(--primary); color: white;
            border-radius: var(--radius); margin-bottom: 2rem;
        }
        .score-num { font-size: 4rem; font-weight: 800; line-height: 1; margin: 1rem 0; }

        .btn-group { display: flex; flex-direction: column; gap: 1rem; align-items: center; margin: 2rem auto; width: 100%; }

        .cta-btn {
            background: var(--primary); color: white; border: none; padding: 1rem; border-radius: 12px;
            font-size: 1.1rem; font-weight: 800; cursor: pointer; width: 100%; max-width: 400px;
            transition: background 0.2s;
        }
        .cta-btn:active { transform: scale(0.98); }
        .cta-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .restart-btn {
            background: white; color: var(--primary); border: 2px solid var(--primary); 
            padding: 1rem; border-radius: 12px; font-size: 1.1rem; font-weight: 800; 
            cursor: pointer; width: 100%; max-width: 400px; display: none;
        }

        @media (max-width: 600px) {
            .hero h1 { font-size: 1.8rem; }
            .glass-card { padding: 1rem; }
            .option-pill { padding: 0.8rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">📱 EEAI Simulator <span style="font-size: 0.7rem; color: var(--text-dim);">v5.0</span></div>
        <div id="timer" class="timer-badge">30:00</div>
    </nav>

    <div class="container">
        <div class="hero">
            <h1>Official Simulation</h1>
            <p>2026 Standards | 10 Closed & 3 Open</p>
        </div>

        <div id="result-panel" class="result-panel">
            <p style="font-weight: 700; margin: 0; opacity: 0.9;">PART 1 SCORE</p>
            <div class="score-num" id="final-score">0 / 15</div>
            <p id="grade-comment" style="font-size: 1rem; font-weight: 600; margin:0;"></p>
        </div>

        <form id="exam-form">
            <div id="questions-area"></div>
            
            <div class="btn-group">
                <button type="button" class="cta-btn" id="submit-btn" onclick="submitExam()">SUBMIT FOR GRADING</button>
                <button type="button" class="restart-btn" id="restart-btn" onclick="restartExam()">RETRY NEW EXAM</button>
            </div>
        </form>
    </div>

    <!-- External Massive Question Bank -->
    <script src="questions.js"></script>

    <script>
        let timeLeft = 30 * 60;
        let timerInterval;
        let userClosed = new Array(10).fill(null);
        let currentClosed = [], currentOpen = [];

        function init() {
            clearInterval(timerInterval);
            timeLeft = 30 * 60;
            userClosed = new Array(10).fill(null);
            
            // Reset UI
            document.getElementById('submit-btn').disabled = false;
            document.getElementById('submit-btn').style.display = 'block';
            document.getElementById('restart-btn').style.display = 'none';
            document.getElementById('result-panel').style.display = 'none';
            
            // Draw random questions from the massive pool
            currentClosed = [...closedPool].sort(() => Math.random() - 0.5).slice(0, 10);
            currentOpen = [...openPool].sort(() => Math.random() - 0.5).slice(0, 3);
            
            const area = document.getElementById('questions-area');
            area.innerHTML = '';

            // Render Closed
            currentClosed.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'glass-card';
                card.innerHTML = `
                    <div class="section-header">
                        <span class="section-tag">Question ${idx+1} / 13</span>
                        <span class="points-tag">(1.5 pts)</span>
                    </div>
                    <span class="question-text">${item.q}</span>
                    <div class="options-grid" id="opt-group-${idx}">
                        ${item.o.map((o, i) => `
                            <div class="option-pill" onclick="select(${idx}, ${i})">
                                <div class="idx-circle">${String.fromCharCode(65+i)}</div>
                                <span>${o}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="explanation" id="feed-${idx}">
                        <strong>Key Concept:</strong> ${item.e}<br>
                        <span class="source-chip">📖 Source: ${item.src}</span>
                    </div>
                `;
                area.appendChild(card);
            });

            // Render Open
            currentOpen.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'glass-card';
                card.innerHTML = `
                    <div class="section-header">
                        <span class="section-tag">Technical Challenge Q${idx+11}</span>
                        <span class="points-tag">(5.0 pts)</span>
                    </div>
                    <span class="question-text">${item.q}</span>
                    <textarea placeholder="Candidate's detailed derivation/analysis..." id="open-text-${idx}"></textarea>
                    <div class="explanation" id="open-feed-${idx}">
                        <strong>Reference Solution:</strong><br>${item.a}<br>
                        <span class="source-chip">📖 Source: ${item.src}</span>
                    </div>
                `;
                area.appendChild(card);
            });

            startTimer();
        }

        function startTimer() {
            const timerEl = document.getElementById('timer');
            timerInterval = setInterval(() => {
                let m = Math.floor(timeLeft / 60), s = timeLeft % 60;
                timerEl.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                if (timeLeft <= 0) { clearInterval(timerInterval); submitExam(); }
                timeLeft--;
            }, 1000);
        }

        window.select = (qIdx, oIdx) => {
            if (document.getElementById('submit-btn').style.display === 'none') return;
            userClosed[qIdx] = oIdx;
            const pills = document.querySelectorAll(`#opt-group-${qIdx} .option-pill`);
            pills.forEach((p, i) => p.classList.toggle('selected', i === oIdx));
        };

        window.restartExam = () => {
            init();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.submitExam = () => {
            clearInterval(timerInterval);
            
            // Swap buttons
            document.getElementById('submit-btn').style.display = 'none';
            document.getElementById('restart-btn').style.display = 'block';
            
            let score = 0;
            currentClosed.forEach((item, idx) => {
                const pills = document.querySelectorAll(`#opt-group-${idx} .option-pill`);
                document.getElementById(`feed-${idx}`).style.display = 'block';
                if (userClosed[idx] === item.a) { 
                    score += 1.5; 
                    pills[item.a].classList.add('correct'); 
                } else { 
                    if (userClosed[idx] !== null) pills[userClosed[idx]].classList.add('wrong'); 
                    pills[item.a].classList.add('correct'); 
                }
            });

            currentOpen.forEach((_, idx) => document.getElementById(`open-feed-${idx}`).style.display = 'block');

            document.getElementById('result-panel').style.display = 'block';
            document.getElementById('final-score').innerText = `${score} / 15`;
            document.getElementById('grade-comment').innerText = "Evaluate Part 2 (15 pts) manually using the references below.";
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        init();
    </script>
</body>
</html>
