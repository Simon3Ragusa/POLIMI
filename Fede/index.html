<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Amoretto's Adventure - Pro Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pacifico&display=swap');

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh; background-color: #fbcce7; color: white; font-family: 'Press+Start+2P', cursive;
            overflow-x: hidden; touch-action: none;
        }

        #game-wrapper {
            display: flex; flex-direction: column; width: 100%; max-width: 900px;
            background: #fff; border: 6px solid #ff69b4; border-radius: 20px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.4);
        }

        #game-container { position: relative; width: 100%; aspect-ratio: 2 / 1; background: linear-gradient(to bottom, #a1c4fd 0%, #c2e9fb 100%); overflow: hidden; }

        canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

        #ui {
            position: absolute; top: 10px; left: 10px; font-size: 8px; text-shadow: 1px 1px #ff69b4;
            pointer-events: none; z-index: 5; width: 100%;
        }

        #game-title {
            font-family: 'Pacifico', cursive; font-size: 24px; color: #ff69b4; text-shadow: 2px 2px #fff;
            margin-bottom: 5px;
        }

        #inventory { display: flex; gap: 5px; margin-top: 5px; }
        .inv-item { width: 15px; height: 20px; background: rgba(0,0,0,0.2); border: 1px solid #fff; }
        .inv-item.collected { background: #ff69b4; }

        #message-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 192, 203, 0.95); display: none; flex-direction: column;
            justify-content: center; align-items: center; text-align: center; padding: 20px; z-index: 20;
        }

        #message-overlay h1 { font-size: 12px; line-height: 1.6; color: #d10068; margin-bottom: 20px; }

        #message-overlay button {
            padding: 15px 30px; font-family: 'Press+Start+2P', cursive; background: #fff;
            border: 3px solid #ff69b4; color: #ff69b4; cursor: pointer; font-size: 10px;
        }

        #controls-area {
            width: 100%; background: #fdf2f8; padding: 15px; display: flex;
            justify-content: space-between; align-items: center; border-top: 4px solid #ff69b4;
        }

        .btn-group { display: flex; gap: 15px; }

        .btn {
            width: clamp(55px, 14vw, 75px); height: clamp(55px, 14vw, 75px);
            background: #fff; border: 4px solid #ff69b4; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            user-select: none; font-size: 14px; color: #ff69b4;
            box-shadow: 0 4px 0 #ffb6c1; transition: all 0.1s;
        }

        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #ffb6c1; background: #fff0f5; }

        #jump-btn { background: #a1c4fd; color: #fff; border-color: #7fb4f0; box-shadow: 0 4px 0 #6096d1; }
        #shoot-btn { background: #ff69b4; color: #fff; border-color: #d10068; box-shadow: 0 4px 0 #a30052; }

    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="ui">
            <div id="game-title">Amoretto's Adventure</div>
            <div id="collection-text">COLLECTED RHODE: 0/5</div>
            <div id="inventory">
                <div class="inv-item" id="inv-0"></div>
                <div class="inv-item" id="inv-1"></div>
                <div class="inv-item" id="inv-2"></div>
                <div class="inv-item" id="inv-3"></div>
                <div class="inv-item" id="inv-4"></div>
            </div>
        </div>
        <div id="message-overlay">
            <h1 id="victory-text"></h1>
            <button onclick="resetGame()">Riprova</button>
        </div>
    </div>
    
    <div id="controls-area">
        <div class="btn-group">
            <div class="btn" id="left-btn">←</div>
            <div class="btn" id="right-btn">→</div>
        </div>
        <div class="btn-group">
            <div class="btn" id="jump-btn">↑</div>
            <div class="btn" id="shoot-btn">♥</div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const victoryScreen = document.getElementById('message-overlay');
    const victoryText = document.getElementById('victory-text');
    const collectionText = document.getElementById('collection-text');

    // Constants
    const SPEED = 4.5;
    const GROUND_HEIGHT = 60;
    const BULLET_SPEED = 8;
    const GRAVITY = 0.5;
    const JUMP_FORCE = -11;

    // State
    let player = {
        x: 50, y: 0, width: 28, height: 42,
        velX: 0, velY: 0, grounded: false, lastShootTime: 0
    };

    let keys = {};
    let obstacles = [];
    let mamme = [];
    let platforms = [];
    let products = [];
    let bullets = [];
    let sparkles = [];
    let collectedCount = 0;
    let cameraX = 0;
    let levelWidth = 6000;
    let gameOver = false;

    const COLORS = {
        sky: '#a1c4fd', ground: '#fbcce7', hair: '#4B3621', dress: '#ff69b4', skin: '#ffdbac', rhodeGray: '#e5e5e5'
    };

    const RHODE_LIST = [
        "PEPTIDE LIP TREATMENT",
        "BARRIER RESTORE CREAM",
        "GLAZING MILK",
        "PEPTIDE GLAZING FLUID",
        "POCKET BLUSH"
    ];

    function initLevel() {
        player.x = 100;
        player.y = canvas.height - GROUND_HEIGHT - player.height;
        player.velX = 0; player.velY = 0;
        cameraX = 0;
        gameOver = false;
        collectedCount = 0;
        victoryScreen.style.display = 'none';
        bullets = []; sparkles = [];
        collectionText.innerText = "COLLECTED RHODE: 0/5";
        for(let i=0; i<5; i++) document.getElementById(`inv-${i}`).classList.remove('collected');

        // Reachability Checked Platforms
        platforms = [
            { x: 300, y: 300, width: 150, height: 15 },
            { x: 600, y: 220, width: 150, height: 15 },
            { x: 1000, y: 280, width: 150, height: 15 },
            { x: 1400, y: 180, width: 150, height: 15 },
            { x: 1900, y: 280, width: 150, height: 15 },
            { x: 2300, y: 200, width: 150, height: 15 },
            { x: 2800, y: 280, width: 200, height: 15 },
            { x: 3300, y: 180, width: 200, height: 15 },
            { x: 3900, y: 250, width: 200, height: 15 },
            { x: 4500, y: 180, width: 200, height: 15 },
            { x: 5200, y: 280, width: 200, height: 15 }
        ];

        // Products on reachable platforms or ground
        products = [
            { x: 650, y: 180, name: RHODE_LIST[0], width: 15, height: 30, collected: false },
            { x: 1450, y: 140, name: RHODE_LIST[1], width: 15, height: 30, collected: false },
            { x: 2350, y: 160, name: RHODE_LIST[2], width: 15, height: 30, collected: false },
            { x: 3350, y: 140, name: RHODE_LIST[3], width: 15, height: 30, collected: false },
            { x: 4550, y: 140, name: RHODE_LIST[4], width: 15, height: 30, collected: false }
        ];

        // Obstacles (Text)
        obstacles = [];
        for (let i = 0; i < 20; i++) {
            let ox = 800 + (i * 300);
            obstacles.push({
                x: ox, y: canvas.height - GROUND_HEIGHT - 20, baseX: ox,
                width: 140, height: 15, speed: 2.5, text: "overstimulation", hp: 3
            });
        }

        // Mamme (Jumping)
        mamme = [];
        for (let i = 0; i < 12; i++) {
            let mx = 1100 + (i * 550);
            mamme.push({
                x: mx, y: canvas.height - GROUND_HEIGHT - 40, width: 32, height: 40,
                velY: 0, grounded: true, jumpTimer: Math.random() * 100
            });
        }
    }

    // Controls
    const setupBtn = (id, code) => {
        const btn = document.getElementById(id);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[code] = true; });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[code] = false; });
        btn.addEventListener('mousedown', (e) => { keys[code] = true; });
        btn.addEventListener('mouseup', (e) => { keys[code] = false; });
    };
    setupBtn('left-btn', 'ArrowLeft');
    setupBtn('right-btn', 'ArrowRight');
    setupBtn('jump-btn', 'KeyW');
    setupBtn('shoot-btn', 'Space');

    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    function resetGame() { initLevel(); }

    function shoot() {
        const now = Date.now();
        if (now - player.lastShootTime > 250) {
            bullets.push({ x: player.x + player.width, y: player.y + 15, width: 12, height: 12 });
            player.lastShootTime = now;
        }
    }

    function drawPlayer() {
        ctx.save();
        ctx.translate(player.x - cameraX, player.y);
        ctx.fillStyle = COLORS.hair; ctx.fillRect(-2, -4, 32, 18); ctx.fillRect(-2, 0, 6, 30); ctx.fillRect(24, 0, 6, 30);
        ctx.fillStyle = COLORS.skin; ctx.fillRect(4, 0, 20, 20);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)'; ctx.fillRect(-8, 10, 8, 16); ctx.fillRect(28, 10, 8, 16);
        ctx.fillStyle = COLORS.dress; ctx.fillRect(0, 20, 28, 22);
        ctx.fillStyle = '#000'; ctx.fillRect(8, 8, 3, 3); ctx.fillRect(17, 8, 3, 3);
        ctx.restore();
    }

    function update() {
        if (gameOver) return;

        if (keys['ArrowRight'] || keys['KeyD']) { if (player.velX < SPEED) player.velX += 0.4; }
        else if (keys['ArrowLeft'] || keys['KeyA']) { if (player.velX > -SPEED) player.velX -= 0.4; }
        else { player.velX *= 0.85; }

        if ((keys['KeyW'] || keys['ArrowUp']) && player.grounded) {
            player.velY = JUMP_FORCE; player.grounded = false;
        }
        if (keys['Space']) shoot();

        player.velY += GRAVITY;
        player.x += player.velX;
        player.y += player.velY;

        if (player.x < 0) player.x = 0;
        if (player.y > canvas.height - GROUND_HEIGHT - player.height) {
            player.y = canvas.height - GROUND_HEIGHT - player.height;
            player.velY = 0; player.grounded = true;
        }

        platforms.forEach(p => {
            if (player.velY > 0 && player.x + player.width > p.x && player.x < p.x + p.width &&
                player.y + player.height > p.y && player.y + player.height < p.y + p.height + player.velY) {
                player.y = p.y - player.height; player.velY = 0; player.grounded = true;
            }
        });

        cameraX = Math.max(0, Math.min(player.x - canvas.width / 3, levelWidth - canvas.width));

        bullets.forEach((b, i) => {
            b.x += BULLET_SPEED;
            if (b.x > cameraX + canvas.width) bullets.splice(i, 1);
            obstacles.forEach((obs, oi) => {
                if (b.x < obs.x + obs.width && b.x + b.width > obs.x && b.y < obs.y && b.y + b.height > obs.y - 15) {
                    obs.hp--; bullets.splice(i, 1);
                    if (obs.hp <= 0) {
                        for(let j=0; j<5; j++) sparkles.push({x: obs.x+70, y: obs.y, vx: Math.random()*4-2, vy: Math.random()*-4, life: 1.0});
                        obstacles.splice(oi, 1);
                    }
                }
            });
        });

        obstacles.forEach(obs => {
            obs.x -= 2.5;
            if (player.x < obs.x + obs.width && player.x + player.width > obs.x && player.y + player.height > obs.y - 10 && player.y < obs.y) initLevel();
        });

        mamme.forEach(m => {
            m.x -= 2;
            m.jumpTimer++;
            if (m.grounded && m.jumpTimer > 150) {
                m.velY = -8; m.grounded = false; m.jumpTimer = 0;
            }
            m.velY += 0.3; m.y += m.velY;
            if (m.y > canvas.height - GROUND_HEIGHT - m.height) {
                m.y = canvas.height - GROUND_HEIGHT - m.height; m.velY = 0; m.grounded = true;
            }
            if (player.x < m.x + m.width && player.x + player.width > m.x && player.y < m.y + m.height && player.y + player.height > m.y) initLevel();
        });

        products.forEach((p, idx) => {
            if (!p.collected && player.x < p.x + p.width && player.x + player.width > p.x && player.y < p.y + p.height && player.y + player.height > p.y) {
                p.collected = true; collectedCount++;
                collectionText.innerText = `COLLECTED RHODE: ${collectedCount}/5`;
                document.getElementById(`inv-${idx}`).classList.add('collected');
                for(let j=0; j<10; j++) sparkles.push({x: p.x, y: p.y, vx: Math.random()*6-3, vy: Math.random()*-6, life: 1.0});
            }
        });

        sparkles.forEach((s, i) => { s.x += s.vx; s.y += s.vy; s.life -= 0.03; if (s.life <= 0) sparkles.splice(i, 1); });

        if (player.x > levelWidth - 300) {
            if (collectedCount >= 5) {
                gameOver = true;
                victoryText.innerHTML = "Hai tutti i prodotti Rhode!<br>Sei una vera Amoretto Pro!<br>Dai un bacio a Simone!";
                victoryScreen.style.display = 'flex';
            } else { player.x = levelWidth - 310; }
        }
    }

    function draw() {
        ctx.fillStyle = '#a1c4fd'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#a1c4fd'); grad.addColorStop(1, '#c2e9fb');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);

        platforms.forEach(p => {
            ctx.fillStyle = '#fff'; ctx.fillRect(p.x - cameraX, p.y, p.width, p.height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)'; ctx.fillRect(p.x - cameraX, p.y + p.height, p.width, 4);
        });

        products.forEach(p => {
            if (!p.collected) {
                ctx.fillStyle = COLORS.rhodeGray; ctx.fillRect(p.x - cameraX, p.y, p.width, p.height);
                ctx.fillStyle = '#fff'; ctx.fillRect(p.x - cameraX+3, p.y-4, p.width-6, 4);
                ctx.fillStyle = '#000'; ctx.font = '6px "Press Start 2P"'; ctx.fillText(p.name, p.x - cameraX - 10, p.y - 10);
            }
        });

        ctx.fillStyle = COLORS.ground; ctx.fillRect(0, canvas.height - GROUND_HEIGHT, canvas.width, GROUND_HEIGHT);
        ctx.fillStyle = collectedCount >= 5 ? '#ff4d4d' : '#888'; ctx.fillRect(levelWidth - 300 - cameraX, canvas.height - GROUND_HEIGHT - 60, 60, 60);

        ctx.fillStyle = '#ff69b4'; bullets.forEach(b => ctx.fillRect(b.x - cameraX, b.y, b.width, b.height));

        obstacles.forEach(obs => { ctx.fillStyle = obs.hp > 1 ? '#555' : '#ff0000'; ctx.font = '8px "Press Start 2P"'; ctx.fillText(obs.text, obs.x - cameraX, obs.y); });

        mamme.forEach(m => {
            ctx.fillStyle = '#8b0000'; ctx.fillRect(m.x - cameraX, m.y, m.width, m.height);
            ctx.fillStyle = COLORS.skin; ctx.fillRect(m.x - cameraX + 4, m.y + 4, 24, 16);
            ctx.fillStyle = '#000'; ctx.font = '6px "Press Start 2P"'; ctx.fillText("MAMMA", m.x - cameraX - 10, m.y - 10);
        });

        sparkles.forEach(s => { ctx.fillStyle = `rgba(255, 255, 255, ${s.life})`; ctx.fillRect(s.x - cameraX, s.y, 4, 4); });

        drawPlayer();
        if (!gameOver) requestAnimationFrame(draw);
    }

    setInterval(update, 1000/60);
    initLevel();
    draw();

</script>
</body>
</html>
