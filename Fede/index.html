<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Amoretto's Adventure - Ultimate Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Press+Start+2P', cursive; }

        body {
            margin: 0; padding: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh; background-color: #fbcce7; color: white;
            overflow-x: hidden; touch-action: none;
        }

        #game-wrapper {
            display: flex; flex-direction: column; width: 100%; max-width: 900px;
            background: #fff; border: 6px solid #ff69b4; border-radius: 20px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.4);
            max-height: 98vh;
        }

        #game-container { position: relative; width: 100%; aspect-ratio: 2 / 1; background: linear-gradient(to bottom, #a1c4fd 0%, #c2e9fb 100%); overflow: hidden; }

        canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

        #ui {
            position: absolute; top: 10px; left: 10px; font-size: 8px; text-shadow: 1px 1px #ff69b4;
            pointer-events: none; z-index: 5; width: 100%;
        }

        #game-title {
            font-size: clamp(10px, 3vw, 14px); color: #ff69b4; 
            margin-bottom: 5px;
        }

        #collection-text { font-size: 8px; color: #ff69b4; margin-top: 5px; }

        #inventory { display: flex; gap: 5px; margin-top: 5px; }
        .inv-item { width: 15px; height: 20px; background: rgba(255, 105, 180, 0.2); border: 2px solid #fff; border-radius: 4px; }
        .inv-item.collected { background: #ff69b4; box-shadow: 0 0 5px #fff; }

        #message-overlay, #alert-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 192, 203, 0.95); display: none; flex-direction: column;
            justify-content: center; align-items: center; text-align: center; padding: 20px; z-index: 20;
        }

        #alert-overlay { background: rgba(0, 0, 0, 0.8); color: #fff; z-index: 30; }

        #message-overlay h1, #alert-overlay h1 { font-size: clamp(10px, 2.5vw, 14px); line-height: 1.8; color: #d10068; margin-bottom: 20px; }
        #alert-overlay h1 { color: #ff4d4d; }

        #message-overlay button, #alert-overlay button {
            padding: 12px 24px; background: #fff;
            border: 3px solid #ff69b4; color: #ff69b4; cursor: pointer; font-size: 10px; border-radius: 10px;
        }

        #controls-area {
            width: 100%; background: #fdf2f8; padding: 15px 25px; display: flex;
            justify-content: space-between; align-items: center; border-top: 4px solid #ff69b4;
        }

        .btn-group { display: flex; gap: 25px; }

        .btn {
            width: clamp(65px, 15vw, 85px); height: clamp(65px, 15vw, 85px);
            background: #fff; border: 5px solid #ff69b4; border-radius: 20px;
            display: flex; justify-content: center; align-items: center;
            user-select: none; font-size: 24px; color: #ff69b4;
            box-shadow: 0 6px 0 #ffb6c1; transition: all 0.05s;
            cursor: pointer;
        }

        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #ffb6c1; background: #fff0f5; }

        #jump-btn { background: #a1c4fd; color: #fff; border-color: #7fb4f0; box-shadow: 0 6px 0 #6096d1; }
        #jump-btn:active { box-shadow: 0 2px 0 #6096d1; }

        #shoot-btn { background: #ff69b4; color: #fff; border-color: #d10068; box-shadow: 0 6px 0 #a30052; }
        #shoot-btn:active { box-shadow: 0 2px 0 #a30052; }

        @media screen and (orientation: landscape) and (max-height: 500px) {
            #game-wrapper { border-width: 3px; }
            #game-title { font-size: 10px; margin: 0; }
            #collection-text { font-size: 8px; display: inline-block; margin-left: 10px; }
            #inventory { margin-top: 0; margin-left: 10px; display: inline-flex; }
            #controls-area { padding: 5px 30px; }
            .btn { width: clamp(55px, 18vh, 75px); height: clamp(55px, 18vh, 75px); border-width: 3px; }
            #ui { display: flex; align-items: baseline; gap: 5px; }
        }

    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="ui">
            <div id="game-title">AMORETTO'S ADVENTURE</div>
            <div id="collection-text">RHODE ITEMS: 0/5</div>
            <div id="inventory">
                <div class="inv-item" id="inv-0"></div>
                <div class="inv-item" id="inv-1"></div>
                <div class="inv-item" id="inv-2"></div>
                <div class="inv-item" id="inv-3"></div>
                <div class="inv-item" id="inv-4"></div>
            </div>
        </div>
        <div id="alert-overlay">
            <h1>STOP! <br><br> PRENDI TUTTI <br> I PRODOTTI RHODE <br> PRIMA DI FINIRE!</h1>
            <button onclick="closeAlert()">TORNA INDIETRO</button>
        </div>
        <div id="message-overlay">
            <h1 id="victory-text"></h1>
            <button id="play-again-btn">GIOCA ANCORA!</button>
        </div>
    </div>
    
    <div id="controls-area">
        <div class="btn-group">
            <div class="btn" id="left-btn">←</div>
            <div class="btn" id="right-btn">→</div>
        </div>
        <div class="btn-group">
            <div class="btn" id="jump-btn">↑</div>
            <div class="btn" id="shoot-btn">♥</div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const victoryScreen = document.getElementById('message-overlay');
    const alertScreen = document.getElementById('alert-overlay');
    const victoryText = document.getElementById('victory-text');
    const collectionText = document.getElementById('collection-text');
    const playAgainBtn = document.getElementById('play-again-btn');

    // CONFIGURAZIONE VELOCITA' (BILANCIATA)
    const SPEED = 3.8;
    const GROUND_HEIGHT = 60;
    const BULLET_SPEED = 7;
    const GRAVITY = 0.5;
    const JUMP_FORCE = -11.5;
    const OBSTACLE_BASE_SPEED = 1.8;
    const MAMMA_BASE_SPEED = 1.3;

    let player = { x: 50, y: 0, width: 28, height: 42, velX: 0, velY: 0, grounded: false, lastShootTime: 0 };
    let keys = {};
    let obstacles = [];
    let mamme = [];
    let platforms = [];
    let products = [];
    let bullets = [];
    let sparkles = [];
    let collectedCount = 0;
    let cameraX = 0;
    let levelWidth = 8000;
    let gameOver = false;
    let isAlerting = false;
    let spawnTimer = 0;
    let isGameRunning = false;

    const COLORS = { sky: '#a1c4fd', ground: '#fbcce7', hair: '#4B3621', dress: '#ff69b4', skin: '#ffdbac', rhodeGray: '#e5e5e5' };
    const RHODE_LIST = ["LIP TREATMENT", "RESTORE CREAM", "GLAZING MILK", "GLAZING FLUID", "POCKET BLUSH"];

    function initLevel() {
        player.x = 100; player.y = canvas.height - GROUND_HEIGHT - player.height; player.velX = 0; player.velY = 0;
        cameraX = 0; gameOver = false; isAlerting = false; collectedCount = 0;
        victoryScreen.style.display = 'none'; alertScreen.style.display = 'none';
        bullets = []; sparkles = []; obstacles = []; mamme = [];
        collectionText.innerText = "RHODE ITEMS: 0/5";
        for(let i=0; i<5; i++) document.getElementById(`inv-${i}`).classList.remove('collected');
        spawnTimer = 0;
        keys = {};

        platforms = [
            { x: 300, y: 310, width: 100, height: 10 }, { x: 450, y: 240, width: 100, height: 10 }, { x: 600, y: 170, width: 150, height: 10 },
            { x: 1100, y: 300, width: 100, height: 10 }, { x: 1250, y: 230, width: 100, height: 10 }, { x: 1400, y: 160, width: 150, height: 10 },
            { x: 2000, y: 310, width: 100, height: 10 }, { x: 2150, y: 240, width: 100, height: 10 }, { x: 2300, y: 170, width: 150, height: 10 },
            { x: 3000, y: 300, width: 100, height: 10 }, { x: 3150, y: 230, width: 100, height: 10 }, { x: 3300, y: 160, width: 150, height: 10 },
            { x: 4200, y: 310, width: 100, height: 10 }, { x: 4350, y: 240, width: 100, height: 10 }, { x: 4500, y: 170, width: 150, height: 10 },
            { x: 5500, y: 310, width: 100, height: 10 }, { x: 5650, y: 240, width: 100, height: 10 }, { x: 5800, y: 170, width: 150, height: 10 }
        ];

        products = [
            { x: 650, y: 130, name: RHODE_LIST[0], width: 15, height: 30, collected: false },
            { x: 1450, y: 120, name: RHODE_LIST[1], width: 15, height: 30, collected: false },
            { x: 2350, y: 130, name: RHODE_LIST[2], width: 15, height: 30, collected: false },
            { x: 3350, y: 120, name: RHODE_LIST[3], width: 15, height: 30, collected: false },
            { x: 5850, y: 130, name: RHODE_LIST[4], width: 15, height: 30, collected: false }
        ];
        
        if (!isGameRunning) {
            isGameRunning = true;
            gameLoop();
        }
    }

    function spawnEnemies() {
        spawnTimer++;
        if (spawnTimer > 150) {
            let spawnX = cameraX + canvas.width + 50;
            if (Math.random() > 0.4) {
                obstacles.push({ x: spawnX, y: canvas.height - GROUND_HEIGHT - 20, width: 140, speed: OBSTACLE_BASE_SPEED + Math.random(), text: "overstimulation", hp: 3 });
            } else {
                mamme.push({ x: spawnX, y: canvas.height - GROUND_HEIGHT - 40, width: 32, height: 40, velY: 0, grounded: true, jumpTimer: 0, hp: 2 });
            }
            spawnTimer = 0;
        }
    }

    const setupBtn = (id, code) => {
        const btn = document.getElementById(id);
        const handleDown = (e) => { e.preventDefault(); if(!isAlerting) keys[code] = true; };
        const handleUp = (e) => { e.preventDefault(); keys[code] = false; };
        btn.addEventListener('touchstart', handleDown); btn.addEventListener('touchend', handleUp);
        btn.addEventListener('mousedown', handleDown); btn.addEventListener('mouseup', handleUp); btn.addEventListener('mouseleave', handleUp);
    };
    setupBtn('left-btn', 'ArrowLeft'); setupBtn('right-btn', 'ArrowRight'); setupBtn('jump-btn', 'KeyW'); setupBtn('shoot-btn', 'Space');

    playAgainBtn.onclick = () => { initLevel(); };
    function closeAlert() { isAlerting = false; alertScreen.style.display = 'none'; player.x -= 150; }

    window.addEventListener('keydown', e => { if(!isAlerting) keys[e.code] = true; });
    window.addEventListener('keyup', e => keys[e.code] = false);

    function shoot() {
        const now = Date.now();
        if (now - player.lastShootTime > 250) {
            bullets.push({ x: player.x + player.width, y: player.y + 15, width: 12, height: 12 });
            player.lastShootTime = now;
        }
    }

    function update() {
        if (gameOver || isAlerting) return;
        spawnEnemies();
        if (keys['ArrowRight'] || keys['KeyD']) { if (player.velX < SPEED) player.velX += 0.4; }
        else if (keys['ArrowLeft'] || keys['KeyA']) { if (player.velX > -SPEED) player.velX -= 0.4; }
        else { player.velX *= 0.85; }
        if ((keys['KeyW'] || keys['ArrowUp']) && player.grounded) { player.velY = JUMP_FORCE; player.grounded = false; }
        if (keys['Space']) shoot();
        player.velY += GRAVITY; player.x += player.velX; player.y += player.velY;
        if (player.x < 0) player.x = 0;
        if (player.y > canvas.height - GROUND_HEIGHT - player.height) { player.y = canvas.height - GROUND_HEIGHT - player.height; player.velY = 0; player.grounded = true; }
        platforms.forEach(p => {
            if (player.velY > 0 && player.x + player.width > p.x && player.x < p.x + p.width && player.y + player.height > p.y && player.y + player.height < p.y + p.height + player.velY) {
                player.y = p.y - player.height; player.velY = 0; player.grounded = true;
            }
        });
        cameraX = Math.max(0, Math.min(player.x - canvas.width / 3, levelWidth - canvas.width));
        bullets.forEach((b, i) => {
            b.x += BULLET_SPEED; if (b.x > cameraX + canvas.width) bullets.splice(i, 1);
            obstacles.forEach((obs, oi) => {
                if (b.x < obs.x + obs.width && b.x + b.width > obs.x && b.y < obs.y && b.y + b.height > obs.y - 15) {
                    obs.hp--; bullets.splice(i, 1);
                    if (obs.hp <= 0) { for(let j=0; j<5; j++) sparkles.push({x: obs.x+70, y: obs.y, vx: Math.random()*4-2, vy: Math.random()*-4, life: 1.0}); obstacles.splice(oi, 1); }
                }
            });
            mamme.forEach((m, mi) => {
                if (b.x < m.x + m.width && b.x + b.width > m.x && b.y < m.y + m.height && b.y + b.height > m.y) {
                    m.hp--; bullets.splice(i, 1);
                    if (m.hp <= 0) { for(let j=0; j<8; j++) sparkles.push({x: m.x+16, y: m.y+20, vx: Math.random()*4-2, vy: Math.random()*-4, life: 1.0}); mamme.splice(mi, 1); }
                }
            });
        });
        obstacles.forEach((obs, i) => { obs.x -= obs.speed; if (obs.x < cameraX - 200) obstacles.splice(i, 1); if (player.x < obs.x + obs.width && player.x + player.width > obs.x && player.y + player.height > obs.y - 10 && player.y < obs.y) initLevel(); });
        mamme.forEach((m, i) => {
            m.x -= MAMMA_BASE_SPEED; m.jumpTimer++; if (m.x < cameraX - 100) mamme.splice(i, 1);
            if (m.grounded && m.jumpTimer > 180) { m.velY = -8.5; m.grounded = false; m.jumpTimer = 0; }
            m.velY += 0.3; m.y += m.velY;
            if (m.y > canvas.height - GROUND_HEIGHT - m.height) { m.y = canvas.height - GROUND_HEIGHT - m.height; m.velY = 0; m.grounded = true; }
            if (player.x < m.x + m.width && player.x + player.width > m.x && player.y < m.y + m.height && player.y + player.height > m.y) initLevel();
        });
        products.forEach((p, idx) => { if (!p.collected && player.x < p.x + p.width && player.x + player.width > p.x && player.y < p.y + p.height && player.y + player.height > p.y) {
            p.collected = true; collectedCount++; collectionText.innerText = `RHODE ITEMS: ${collectedCount}/5`; document.getElementById(`inv-${idx}`).classList.add('collected');
            for(let j=0; j<10; j++) sparkles.push({x: p.x, y: p.y, vx: Math.random()*6-3, vy: Math.random()*-6, life: 1.0});
        }});
        sparkles.forEach((s, i) => { s.x += s.vx; s.y += s.vy; s.life -= 0.03; if (s.life <= 0) sparkles.splice(i, 1); });
        if (player.x > levelWidth - 300) {
            if (collectedCount >= 5) { gameOver = true; victoryText.innerHTML = "HAI TUTTI I PRODOTTI RHODE!<br><br>SEI UNA VERA AMORETTO PRO!<br><br>DAI UN BACIO A SIMONE!"; victoryScreen.style.display = 'flex'; }
            else { isAlerting = true; alertScreen.style.display = 'flex'; keys = {}; }
        }
    }

    function draw() {
        ctx.fillStyle = '#a1c4fd'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        let grad = ctx.createLinearGradient(0, 0, 0, canvas.height); grad.addColorStop(0, '#a1c4fd'); grad.addColorStop(1, '#c2e9fb');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
        platforms.forEach(p => { ctx.fillStyle = '#fff'; ctx.fillRect(p.x - cameraX, p.y, p.width, p.height); ctx.fillStyle = 'rgba(255, 255, 255, 0.4)'; ctx.fillRect(p.x - cameraX, p.y + p.height, p.width, 4); });
        products.forEach(p => { if (!p.collected) { ctx.fillStyle = COLORS.rhodeGray; ctx.fillRect(p.x - cameraX, p.y, p.width, p.height); ctx.fillStyle = '#fff'; ctx.fillRect(p.x - cameraX+3, p.y-4, p.width-6, 4); ctx.fillStyle = '#ff69b4'; ctx.font = '6px "Press Start 2P"'; ctx.fillText(p.name, p.x - cameraX - 15, p.y - 15); } });
        ctx.fillStyle = COLORS.ground; ctx.fillRect(0, canvas.height - GROUND_HEIGHT, canvas.width, GROUND_HEIGHT);
        
        let goalX = levelWidth - 300 - cameraX; let goalY = canvas.height - GROUND_HEIGHT - 60; let goalW = 60; let goalH = 60;
        ctx.fillStyle = '#ff4d4d'; ctx.fillRect(goalX, goalY, goalW, goalH);
        ctx.fillStyle = '#ffd700'; ctx.fillRect(goalX + goalW/2 - 6, goalY, 12, goalH); ctx.fillRect(goalX, goalY + goalH/2 - 6, goalW, 12);
        let bowS = 12 + Math.sin(Date.now()/200) * 2;
        ctx.fillRect(goalX + goalW/2 - bowS - 2, goalY - bowS, bowS, bowS); ctx.fillRect(goalX + goalW/2 + 2, goalY - bowS, bowS, bowS);
        ctx.fillStyle = '#ffcc00'; ctx.fillRect(goalX + goalW/2 - 4, goalY - 4, 8, 8);

        ctx.fillStyle = '#ff69b4'; bullets.forEach(b => ctx.fillRect(b.x - cameraX, b.y, b.width, b.height));
        obstacles.forEach(obs => { ctx.fillStyle = obs.hp > 1 ? '#555' : '#ff0000'; ctx.font = '8px "Press Start 2P"'; ctx.fillText(obs.text, obs.x - cameraX, obs.y); });
        mamme.forEach(m => {
            ctx.fillStyle = '#4a0000'; ctx.fillRect(m.x - cameraX, m.y, m.width, m.height); ctx.fillStyle = COLORS.skin; ctx.fillRect(m.x - cameraX + 4, m.y + 4, 24, 16);
            ctx.fillStyle = '#ff0000'; ctx.fillRect(m.x - cameraX + 8, m.y + 8, 4, 4); ctx.fillRect(m.x - cameraX + 20, m.y + 8, 4, 4);
            ctx.fillStyle = '#000'; ctx.fillRect(m.x - cameraX + 6, m.y + 6, 8, 2); ctx.fillRect(m.x - cameraX + 18, m.y + 6, 8, 2);
            ctx.fillStyle = '#ff0000'; ctx.font = '8px "Press Start 2P"'; ctx.fillText("MAMMA", m.x - cameraX - 15, m.y - 25); ctx.fillText("INCAZZATA", m.x - cameraX - 25, m.y - 10);
            ctx.fillStyle = '#ff0000'; ctx.fillRect(m.x - cameraX, m.y - 5, (m.hp/2)*m.width, 3);
        });
        sparkles.forEach(s => { ctx.fillStyle = `rgba(255, 255, 255, ${s.life})`; ctx.fillRect(s.x - cameraX, s.y, 4, 4); });
        ctx.save(); ctx.translate(player.x - cameraX, player.y);
        ctx.fillStyle = COLORS.hair; ctx.fillRect(-2, -4, 32, 18); ctx.fillRect(-2, 0, 6, 30); ctx.fillRect(24, 0, 6, 30); ctx.fillStyle = COLORS.skin; ctx.fillRect(4, 0, 20, 20);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)'; ctx.fillRect(-8, 10, 8, 16); ctx.fillRect(28, 10, 8, 16); ctx.fillStyle = COLORS.dress; ctx.fillRect(0, 20, 28, 22); ctx.fillStyle = '#000'; ctx.fillRect(8, 8, 3, 3); ctx.fillRect(17, 8, 3, 3);
        ctx.restore();
    }

    function gameLoop() {
        if (!isGameRunning) return;
        update();
        draw();
        animationId = requestAnimationFrame(gameLoop);
    }

    initLevel();
</script>
</body>
</html>
