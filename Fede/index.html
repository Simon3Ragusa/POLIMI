<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amoretto's Adventure - Battle Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fbcce7;
            color: white;
            font-family: 'Press+Start+2P', cursive;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 400px;
            border: 4px solid #fff;
            background: linear-gradient(to bottom, #a1c4fd 0%, #c2e9fb 100%);
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.4);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 10px;
            text-shadow: 2px 2px #ff69b4;
            pointer-events: none;
        }

        #message-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 192, 203, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }

        #message-overlay h1 {
            font-size: 14px;
            line-height: 1.8;
            color: #d10068;
        }

        #message-overlay button {
            margin-top: 20px;
            padding: 15px 30px;
            font-family: 'Press+Start+2P', cursive;
            background: #fff;
            border: 3px solid #ff69b4;
            color: #ff69b4;
            cursor: pointer;
            font-size: 12px;
        }

        /* Mobile Controls */
        #controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            pointer-events: none;
        }

        .btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.5);
            border: 3px solid #fff;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            user-select: none;
        }

        .btn:active {
            background: rgba(255, 255, 255, 0.8);
        }

        #shoot-btn {
            width: 100px;
            background: rgba(255, 105, 180, 0.6);
            color: white;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div id="ui">Amoretto's Adventure</div>
    <div id="message-overlay" id="victory-screen">
        <h1 id="victory-text"></h1>
        <button onclick="resetGame()">Ricomincia</button>
    </div>
    
    <div id="controls">
        <div style="display:flex; gap: 10px;">
            <div class="btn" id="left-btn">←</div>
            <div class="btn" id="right-btn">→</div>
        </div>
        <div class="btn" id="shoot-btn">SHOOT</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const victoryScreen = document.getElementById('message-overlay');
    const victoryText = document.getElementById('victory-text');

    // Constants
    const SPEED = 4;
    const GROUND_HEIGHT = 60;
    const BULLET_SPEED = 7;

    // State
    let player = {
        x: 50, y: 0, width: 32, height: 48,
        velX: 0, velY: 0, lastShootTime: 0
    };

    let keys = {};
    let obstacles = [];
    let scenery = [];
    let skyDetails = [];
    let bullets = [];
    let goal = { x: 3000, y: 0, width: 50, height: 50 };
    let cameraX = 0;
    let levelWidth = 3300;
    let gameOver = false;

    const COLORS = {
        sky: '#a1c4fd',
        ground: '#fbcce7',
        hair: '#4B3621',
        dress: '#ff69b4',
        skin: '#ffdbac',
        rhodeGray: '#e5e5e5'
    };

    function initLevel() {
        player.x = 100;
        player.y = canvas.height - GROUND_HEIGHT - player.height;
        player.velX = 0;
        cameraX = 0;
        gameOver = false;
        victoryScreen.style.display = 'none';
        bullets = [];
        
        goal.x = levelWidth - 200;
        goal.y = canvas.height - GROUND_HEIGHT - goal.height;

        obstacles = [];
        for (let i = 0; i < 15; i++) {
            let ox = 600 + (i * 400) + Math.random() * 200;
            obstacles.push({
                x: ox,
                y: canvas.height - GROUND_HEIGHT - 20,
                baseX: ox,
                width: 140,
                height: 15,
                speed: 1.5 + Math.random() * 2,
                text: "overstimulation",
                hp: 3
            });
        }

        scenery = [];
        for (let i = 0; i < 20; i++) {
            scenery.push({
                x: Math.random() * levelWidth,
                y: canvas.height - GROUND_HEIGHT - 40,
                type: Math.random() > 0.5 ? 'bottle' : 'tree'
            });
        }

        // Sky details (Clouds & Stars)
        skyDetails = [];
        for (let i = 0; i < 30; i++) {
            skyDetails.push({
                x: Math.random() * levelWidth,
                y: Math.random() * 200,
                type: Math.random() > 0.7 ? 'cloud' : 'star',
                size: 5 + Math.random() * 15,
                speed: 0.2 + Math.random() * 0.5
            });
        }
    }

    // Input
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    const setupBtn = (id, code) => {
        const btn = document.getElementById(id);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[code] = true; });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[code] = false; });
    };
    setupBtn('left-btn', 'ArrowLeft');
    setupBtn('right-btn', 'ArrowRight');
    setupBtn('shoot-btn', 'Space');

    function resetGame() { initLevel(); }

    function shoot() {
        const now = Date.now();
        if (now - player.lastShootTime > 300) {
            bullets.push({
                x: player.x + player.width,
                y: player.y + 20,
                width: 10,
                height: 10
            });
            player.lastShootTime = now;
        }
    }

    function drawPlayer() {
        ctx.save();
        ctx.translate(player.x - cameraX, player.y);
        // Hair
        ctx.fillStyle = COLORS.hair;
        ctx.fillRect(-2, -4, 36, 20);
        ctx.fillRect(-2, 0, 6, 35);
        ctx.fillRect(28, 0, 6, 35);
        // Head
        ctx.fillStyle = COLORS.skin;
        ctx.fillRect(4, 0, 24, 24);
        // Wings
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.fillRect(-10, 10, 10, 20);
        ctx.fillRect(32, 10, 10, 20);
        // Dress
        ctx.fillStyle = COLORS.dress;
        ctx.fillRect(0, 24, 32, 24);
        // Face
        ctx.fillStyle = '#000';
        ctx.fillRect(8, 10, 4, 4);
        ctx.fillRect(20, 10, 4, 4);
        ctx.restore();
    }

    function drawSky() {
        skyDetails.forEach(s => {
            s.x -= s.speed;
            if (s.x < cameraX - 100) s.x = cameraX + canvas.width + 100;

            if (s.type === 'cloud') {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.fillRect(s.x - cameraX, s.y, s.size * 2, s.size);
                ctx.fillRect(s.x - cameraX + s.size/2, s.y - s.size/2, s.size, s.size);
            } else {
                ctx.fillStyle = '#fff';
                let op = Math.sin(Date.now()/200 + s.x) * 0.5 + 0.5;
                ctx.globalAlpha = op;
                ctx.fillRect(s.x - cameraX, s.y, 4, 4);
                ctx.globalAlpha = 1;
            }
        });
    }

    function update() {
        if (gameOver) return;

        if (keys['ArrowRight'] || keys['KeyD']) {
            if (player.velX < SPEED) player.velX += 0.5;
        } else if (keys['ArrowLeft'] || keys['KeyA']) {
            if (player.velX > -SPEED) player.velX -= 0.5;
        } else {
            player.velX *= 0.8;
        }

        if (keys['Space'] || keys['KeyF']) {
            shoot();
        }

        player.x += player.velX;
        cameraX = Math.max(0, Math.min(player.x - canvas.width / 4, levelWidth - canvas.width));

        // Bullets
        bullets.forEach((b, i) => {
            b.x += BULLET_SPEED;
            if (b.x > cameraX + canvas.width) bullets.splice(i, 1);
            
            obstacles.forEach((obs, oi) => {
                if (b.x < obs.x + obs.width && b.x + b.width > obs.x &&
                    b.y < obs.y && b.y + b.height > obs.y - 15) {
                    obs.hp--;
                    bullets.splice(i, 1);
                    if (obs.hp <= 0) obstacles.splice(oi, 1);
                }
            });
        });

        // Obstacles
        obstacles.forEach(obs => {
            obs.x -= obs.speed;
            if (player.x < obs.x + obs.width && player.x + player.width > obs.x &&
                player.y + player.height > obs.y - 10) {
                initLevel();
            }
        });

        if (player.x + player.width > goal.x) {
            gameOver = true;
            victoryText.innerHTML = "Congratulazioni Amoretto!<br>Hai sconfitto lo stress!<br>Dai un bacio a Simone!";
            victoryScreen.style.display = 'flex';
        }
    }

    function draw() {
        let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#a1c4fd');
        grad.addColorStop(1, '#c2e9fb');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        drawSky();
        scenery.forEach(s => {
            ctx.save();
            ctx.translate(s.x - cameraX, s.y);
            if (s.type === 'bottle') {
                ctx.fillStyle = COLORS.rhodeGray; ctx.fillRect(0, 0, 15, 30);
                ctx.fillStyle = '#fff'; ctx.fillRect(2, -5, 11, 5);
            } else {
                ctx.fillStyle = '#fff'; ctx.fillRect(5, 0, 5, 40);
                ctx.fillStyle = '#ffc0cb'; ctx.fillRect(-5, -15, 25, 25);
            }
            ctx.restore();
        });

        ctx.fillStyle = COLORS.ground;
        ctx.fillRect(0, canvas.height - GROUND_HEIGHT, canvas.width, GROUND_HEIGHT);

        // Draw Goal
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(goal.x - cameraX, goal.y, goal.width, goal.height);

        // Bullets (Pink Hearts)
        ctx.fillStyle = '#ff69b4';
        bullets.forEach(b => {
            ctx.fillRect(b.x - cameraX, b.y, b.width, b.height);
        });

        // Obstacles
        obstacles.forEach(obs => {
            ctx.fillStyle = obs.hp > 1 ? '#555' : '#ff0000';
            ctx.font = '8px "Press Start 2P"';
            ctx.fillText(obs.text, obs.x - cameraX, obs.y);
            // Health bar
            ctx.fillStyle = '#ff69b4';
            ctx.fillRect(obs.x - cameraX, obs.y + 5, (obs.hp/3) * obs.width, 3);
        });

        drawPlayer();
        if (!gameOver) requestAnimationFrame(draw);
    }

    setInterval(update, 1000/60);
    initLevel();
    draw();

</script>
</body>
</html>
