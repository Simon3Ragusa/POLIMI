<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amoretto's Adventure - Fairy Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fbcce7;
            color: white;
            font-family: 'Press+Start+2P', cursive;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 400px;
            border: 4px solid #fff;
            background: linear-gradient(to bottom, #a1c4fd 0%, #c2e9fb 100%);
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.4);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 10px;
            text-shadow: 2px 2px #ff69b4;
            pointer-events: none;
        }

        #message-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 192, 203, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }

        #message-overlay h1 {
            font-size: 14px;
            line-height: 1.8;
            color: #d10068;
        }

        #message-overlay button {
            margin-top: 20px;
            padding: 15px 30px;
            font-family: 'Press+Start+2P', cursive;
            background: #fff;
            border: 3px solid #ff69b4;
            color: #ff69b4;
            cursor: pointer;
            font-size: 12px;
        }

        /* Mobile Controls */
        #controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            pointer-events: none;
        }

        .btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.5);
            border: 3px solid #fff;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            user-select: none;
        }

        .btn:active {
            background: rgba(255, 255, 255, 0.8);
        }

        #jump-btn {
            width: 80px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div id="ui">Amoretto's Adventure</div>
    <div id="message-overlay" id="victory-screen">
        <h1 id="victory-text"></h1>
        <button onclick="resetGame()">Ricomincia</button>
    </div>
    
    <div id="controls">
        <div style="display:flex; gap: 10px;">
            <div class="btn" id="left-btn">←</div>
            <div class="btn" id="right-btn">→</div>
        </div>
        <div class="btn" id="jump-btn">JUMP</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const victoryScreen = document.getElementById('message-overlay');
    const victoryText = document.getElementById('victory-text');

    // Constants
    const GRAVITY = 0.4;
    const JUMP_FORCE = -9;
    const SPEED = 4;
    const GROUND_HEIGHT = 60;

    // State
    let player = {
        x: 50, y: 0, width: 32, height: 48,
        velX: 0, velY: 0, grounded: false
    };

    let keys = {};
    let obstacles = [];
    let scenery = [];
    let goal = { x: 3000, y: 0, width: 50, height: 50 };
    let cameraX = 0;
    let levelWidth = 3300;
    let gameOver = false;
    let particles = [];

    // Skin care theme colors
    const COLORS = {
        sky: '#a1c4fd',
        ground: '#fbcce7',
        hair: '#4B3621',
        dress: '#ff69b4',
        skin: '#ffdbac',
        rhodeGray: '#e5e5e5' // Rhode-like minimalist gray
    };

    function initLevel() {
        player.x = 100;
        player.y = canvas.height - GROUND_HEIGHT - player.height;
        player.velX = 0; player.velY = 0;
        cameraX = 0;
        gameOver = false;
        victoryScreen.style.display = 'none';
        
        // Goal position
        goal.x = levelWidth - 200;
        goal.y = canvas.height - GROUND_HEIGHT - goal.height;

        // Generate obstacles (moving towards player)
        obstacles = [];
        for (let i = 0; i < 12; i++) {
            obstacles.push({
                x: 600 + (i * 450) + Math.random() * 100,
                y: canvas.height - GROUND_HEIGHT - 20,
                baseX: 0, // Assigned later
                width: 160,
                height: 20,
                speed: 1 + Math.random() * 1.5,
                text: "overstimulation"
            });
            obstacles[i].baseX = obstacles[i].x;
        }

        // Scenery (8-bit skincare bottles & fairy trees)
        scenery = [];
        for (let i = 0; i < 20; i++) {
            scenery.push({
                x: Math.random() * levelWidth,
                y: canvas.height - GROUND_HEIGHT - 40,
                type: Math.random() > 0.5 ? 'bottle' : 'tree',
                size: 20 + Math.random() * 20
            });
        }
    }

    // Input
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Mobile touch
    const setupBtn = (id, code) => {
        const btn = document.getElementById(id);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[code] = true; });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[code] = false; });
    };
    setupBtn('left-btn', 'ArrowLeft');
    setupBtn('right-btn', 'ArrowRight');
    setupBtn('jump-btn', 'Space');

    function resetGame() { initLevel(); }

    function drawPlayer() {
        ctx.save();
        ctx.translate(player.x - cameraX, player.y);

        // Hair (Fairy Brunette)
        ctx.fillStyle = COLORS.hair;
        ctx.fillRect(-2, -4, 36, 20); // Longer hair
        ctx.fillRect(-2, 0, 6, 35);
        ctx.fillRect(28, 0, 6, 35);

        // Head
        ctx.fillStyle = COLORS.skin;
        ctx.fillRect(4, 0, 24, 24);

        // Wings (8-bit translucent)
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.fillRect(-10, 10, 10, 20);
        ctx.fillRect(32, 10, 10, 20);

        // Dress
        ctx.fillStyle = COLORS.dress;
        ctx.fillRect(0, 24, 32, 24);

        // Face
        ctx.fillStyle = '#000';
        ctx.fillRect(8, 10, 4, 4);
        ctx.fillRect(20, 10, 4, 4);
        ctx.fillStyle = '#ffb6c1'; // Blush
        ctx.fillRect(4, 16, 4, 2);
        ctx.fillRect(24, 16, 4, 2);

        ctx.restore();
    }

    function drawSkincare(s) {
        ctx.save();
        ctx.translate(s.x - cameraX, s.y);
        if (s.type === 'bottle') {
            // Rhode-style bottle
            ctx.fillStyle = COLORS.rhodeGray;
            ctx.fillRect(0, 0, 15, 30);
            ctx.fillStyle = '#fff';
            ctx.fillRect(2, -5, 11, 5); // cap
            ctx.fillStyle = '#ccc';
            ctx.fillRect(4, 10, 7, 2); // label line
        } else {
            // Fairy Tree (Cotton Candy style)
            ctx.fillStyle = '#fff';
            ctx.fillRect(5, 0, 5, 40); // trunk
            ctx.fillStyle = '#ffc0cb';
            ctx.fillRect(-5, -15, 25, 25);
        }
        ctx.restore();
    }

    function update() {
        if (gameOver) return;

        // Player movement
        if (keys['ArrowRight'] || keys['KeyD']) {
            if (player.velX < SPEED) player.velX += 0.5;
        } else if (keys['ArrowLeft'] || keys['KeyA']) {
            if (player.velX > -SPEED) player.velX -= 0.5;
        } else {
            player.velX *= 0.8;
        }

        if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && player.grounded) {
            player.velY = JUMP_FORCE;
            player.grounded = false;
        }

        player.velY += GRAVITY;
        player.x += player.velX;
        player.y += player.velY;

        // Ground check
        if (player.y > canvas.height - GROUND_HEIGHT - player.height) {
            player.y = canvas.height - GROUND_HEIGHT - player.height;
            player.velY = 0;
            player.grounded = true;
        }

        // Camera
        cameraX = Math.max(0, Math.min(player.x - canvas.width / 2, levelWidth - canvas.width));

        // Obstacles logic: Move towards player when close
        obstacles.forEach(obs => {
            // Move obstacle left
            obs.x -= obs.speed;
            
            // Loop obstacle position so it stays in its zone but feels dynamic
            if (obs.x < obs.baseX - 400) obs.x = obs.baseX + 200;

            // Collision
            if (player.x < obs.x + obs.width &&
                player.x + player.width > obs.x &&
                player.y + player.height > obs.y - 12 &&
                player.y < obs.y) {
                initLevel(); // Die
            }
        });

        // Goal
        if (player.x + player.width > goal.x && player.x < goal.x + goal.width &&
            player.y + player.height > goal.y) {
            gameOver = true;
            victoryText.innerHTML = "Congratulazioni Amoretto!<br>Dai un bacio a Simone per ricevere la tua ricompensa!!!";
            victoryScreen.style.display = 'flex';
        }
    }

    function draw() {
        // Gradient background
        let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#a1c4fd');
        grad.addColorStop(1, '#c2e9fb');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Scenery
        scenery.forEach(drawSkincare);

        // Draw Ground
        ctx.fillStyle = COLORS.ground;
        ctx.fillRect(0, canvas.height - GROUND_HEIGHT, canvas.width, GROUND_HEIGHT);
        ctx.fillStyle = '#fff'; // Sparkles on ground
        for(let i=0; i<levelWidth; i+=100) {
            ctx.fillRect(i - cameraX + (Math.sin(Date.now()/500 + i)*20), canvas.height - GROUND_HEIGHT + 10, 4, 4);
        }

        // Draw Goal (Present with Sparkles)
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(goal.x - cameraX, goal.y, goal.width, goal.height);
        ctx.fillStyle = '#ffff00';
        ctx.fillRect(goal.x - cameraX + 20, goal.y, 10, goal.height);
        ctx.fillRect(goal.x - cameraX, goal.y + 20, goal.width, 10);

        // Draw Obstacles
        ctx.fillStyle = '#555';
        ctx.font = '8px "Press Start 2P"';
        obstacles.forEach(obs => {
            ctx.fillText(obs.text, obs.x - cameraX, obs.y);
        });

        drawPlayer();

        if (!gameOver) requestAnimationFrame(draw);
    }

    setInterval(update, 1000/60);
    initLevel();
    draw();

</script>
</body>
</html>
