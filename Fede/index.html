<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Amoretto's Adventure - Ultimate Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #fbcce7;
            color: white;
            font-family: 'Press+Start+2P', cursive;
            overflow-x: hidden;
            touch-action: none;
        }

        #game-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 900px;
            background: #fff;
            border: 6px solid #ff69b4;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.4);
        }

        #game-container {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 1;
            background: linear-gradient(to bottom, #a1c4fd 0%, #c2e9fb 100%);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: clamp(8px, 2vw, 12px);
            text-shadow: 2px 2px #ff69b4;
            pointer-events: none;
            z-index: 5;
        }

        #message-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 192, 203, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 20;
        }

        #message-overlay h1 {
            font-size: clamp(10px, 4vw, 18px);
            line-height: 1.6;
            color: #d10068;
            margin-bottom: 20px;
        }

        #message-overlay button {
            padding: 15px 30px;
            font-family: 'Press+Start+2P', cursive;
            background: #fff;
            border: 3px solid #ff69b4;
            color: #ff69b4;
            cursor: pointer;
            font-size: 12px;
        }

        #controls-area {
            width: 100%;
            background: #fdf2f8;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 4px solid #ff69b4;
        }

        .btn-group {
            display: flex;
            gap: 15px;
        }

        .btn {
            width: clamp(55px, 14vw, 75px);
            height: clamp(55px, 14vw, 75px);
            background: #fff;
            border: 4px solid #ff69b4;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            user-select: none;
            font-size: clamp(12px, 4vw, 18px);
            color: #ff69b4;
            box-shadow: 0 4px 0 #ffb6c1;
            transition: all 0.1s;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #ffb6c1;
            background: #fff0f5;
        }

        #jump-btn { background: #a1c4fd; color: #fff; border-color: #7fb4f0; box-shadow: 0 4px 0 #6096d1; }
        #jump-btn:active { box-shadow: 0 0 0 #6096d1; }

        #shoot-btn { background: #ff69b4; color: #fff; border-color: #d10068; box-shadow: 0 4px 0 #a30052; }
        #shoot-btn:active { box-shadow: 0 0 0 #a30052; }

    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="ui">Amoretto's Adventure</div>
        <div id="message-overlay" id="victory-screen">
            <h1 id="victory-text"></h1>
            <button onclick="resetGame()">Ricomincia</button>
        </div>
    </div>
    
    <div id="controls-area">
        <div class="btn-group">
            <div class="btn" id="left-btn">←</div>
            <div class="btn" id="right-btn">→</div>
        </div>
        <div class="btn-group">
            <div class="btn" id="jump-btn">↑</div>
            <div class="btn" id="shoot-btn">♥</div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const victoryScreen = document.getElementById('message-overlay');
    const victoryText = document.getElementById('victory-text');

    // Constants
    const SPEED = 4;
    const GROUND_HEIGHT = 60;
    const BULLET_SPEED = 7;
    const GRAVITY = 0.4;
    const JUMP_FORCE = -9;

    // State
    let player = {
        x: 50, y: 0, width: 32, height: 48,
        velX: 0, velY: 0, grounded: false, lastShootTime: 0
    };

    let keys = {};
    let obstacles = [];
    let scenery = [];
    let skyDetails = [];
    let bullets = [];
    let sparkles = [];
    let goal = { x: 4500, y: 0, width: 80, height: 80 };
    let cameraX = 0;
    let levelWidth = 4800;
    let gameOver = false;

    const COLORS = {
        sky: '#a1c4fd', ground: '#fbcce7', hair: '#4B3621', dress: '#ff69b4', skin: '#ffdbac', rhodeGray: '#e5e5e5'
    };

    function initLevel() {
        player.x = 100;
        player.y = canvas.height - GROUND_HEIGHT - player.height;
        player.velX = 0; player.velY = 0;
        cameraX = 0;
        gameOver = false;
        victoryScreen.style.display = 'none';
        bullets = [];
        sparkles = [];
        
        goal.x = levelWidth - 300;
        goal.y = canvas.height - GROUND_HEIGHT - goal.height;

        obstacles = [];
        for (let i = 0; i < 20; i++) {
            let ox = 800 + (i * 450) + Math.random() * 200;
            obstacles.push({
                x: ox, y: canvas.height - GROUND_HEIGHT - 20, baseX: ox,
                width: 140, height: 15, speed: 1.5 + Math.random() * 2, text: "overstimulation", hp: 3
            });
        }

        scenery = [];
        for (let i = 0; i < 30; i++) {
            scenery.push({
                x: Math.random() * levelWidth, y: canvas.height - GROUND_HEIGHT - 40,
                type: Math.random() > 0.5 ? 'bottle' : 'tree'
            });
        }

        skyDetails = [];
        for (let i = 0; i < 40; i++) {
            skyDetails.push({
                x: Math.random() * levelWidth, y: Math.random() * 200,
                type: Math.random() > 0.7 ? 'cloud' : 'star', size: 5 + Math.random() * 15, speed: 0.2 + Math.random() * 0.5
            });
        }
    }

    // Input handling
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    const setupBtn = (id, code) => {
        const btn = document.getElementById(id);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[code] = true; });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[code] = false; });
        btn.addEventListener('mousedown', (e) => { keys[code] = true; });
        btn.addEventListener('mouseup', (e) => { keys[code] = false; });
        btn.addEventListener('mouseleave', (e) => { keys[code] = false; });
    };
    setupBtn('left-btn', 'ArrowLeft');
    setupBtn('right-btn', 'ArrowRight');
    setupBtn('jump-btn', 'KeyW');
    setupBtn('shoot-btn', 'Space');

    function resetGame() { initLevel(); }

    function shoot() {
        const now = Date.now();
        if (now - player.lastShootTime > 300) {
            bullets.push({ x: player.x + player.width, y: player.y + 20, width: 14, height: 14 });
            player.lastShootTime = now;
        }
    }

    function drawPlayer() {
        ctx.save();
        ctx.translate(player.x - cameraX, player.y);
        ctx.fillStyle = COLORS.hair;
        ctx.fillRect(-2, -4, 36, 20); ctx.fillRect(-2, 0, 6, 35); ctx.fillRect(28, 0, 6, 35);
        ctx.fillStyle = COLORS.skin; ctx.fillRect(4, 0, 24, 24);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)'; ctx.fillRect(-10, 10, 10, 20); ctx.fillRect(32, 10, 10, 20);
        ctx.fillStyle = COLORS.dress; ctx.fillRect(0, 24, 32, 24);
        ctx.fillStyle = '#000'; ctx.fillRect(8, 10, 4, 4); ctx.fillRect(20, 10, 4, 4);
        ctx.restore();
    }

    function drawGoal() {
        ctx.save();
        ctx.translate(goal.x - cameraX, goal.y);
        ctx.fillStyle = '#ff4d4d'; ctx.fillRect(0, 0, goal.width, goal.height);
        ctx.fillStyle = '#ffd700';
        ctx.fillRect(goal.width/2 - 8, 0, 16, goal.height);
        ctx.fillRect(0, goal.height/2 - 8, goal.width, 16);
        let bowSize = 20 + Math.sin(Date.now()/200) * 5;
        ctx.fillStyle = '#ffd700';
        ctx.beginPath(); ctx.moveTo(goal.width/2, 0); ctx.lineTo(goal.width/2 - bowSize, -bowSize); ctx.lineTo(goal.width/2, -bowSize/2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(goal.width/2, 0); ctx.lineTo(goal.width/2 + bowSize, -bowSize); ctx.lineTo(goal.width/2, -bowSize/2); ctx.fill();
        if (Math.random() > 0.7) {
            sparkles.push({
                x: goal.x + Math.random() * goal.width,
                y: goal.y + Math.random() * goal.height,
                size: 3 + Math.random() * 5,
                life: 1.0
            });
        }
        ctx.restore();
    }

    function update() {
        if (gameOver) return;
        if (keys['ArrowRight'] || keys['KeyD']) {
            if (player.velX < SPEED) player.velX += 0.5;
        } else if (keys['ArrowLeft'] || keys['KeyA']) {
            if (player.velX > -SPEED) player.velX -= 0.5;
        } else {
            player.velX *= 0.8;
        }
        if ((keys['KeyW'] || keys['ArrowUp']) && player.grounded) {
            player.velY = JUMP_FORCE;
            player.grounded = false;
        }
        if (keys['Space']) shoot();
        player.velY += GRAVITY;
        player.x += player.velX;
        player.y += player.velY;
        if (player.y > canvas.height - GROUND_HEIGHT - player.height) {
            player.y = canvas.height - GROUND_HEIGHT - player.height;
            player.velY = 0; player.grounded = true;
        }
        cameraX = Math.max(0, Math.min(player.x - canvas.width / 3, levelWidth - canvas.width));
        bullets.forEach((b, i) => {
            b.x += BULLET_SPEED;
            if (b.x > cameraX + canvas.width) bullets.splice(i, 1);
            obstacles.forEach((obs, oi) => {
                if (b.x < obs.x + obs.width && b.x + b.width > obs.x && b.y < obs.y && b.y + b.height > obs.y - 15) {
                    obs.hp--; bullets.splice(i, 1);
                    if (obs.hp <= 0) obstacles.splice(oi, 1);
                }
            });
        });
        obstacles.forEach(obs => {
            obs.x -= obs.speed;
            if (player.x < obs.x + obs.width && player.x + player.width > obs.x && player.y + player.height > obs.y - 10 && player.y < obs.y) {
                initLevel();
            }
        });
        sparkles.forEach((s, i) => {
            s.y -= 0.5; s.life -= 0.02;
            if (s.life <= 0) sparkles.splice(i, 1);
        });
        if (player.x + player.width > goal.x && player.y + player.height > goal.y) {
            gameOver = true;
            victoryText.innerHTML = "Congratulazioni Amoretto!<br>Hai sconfitto lo stress!<br>Dai un bacio a Simone!";
            victoryScreen.style.display = 'flex';
        }
    }

    function draw() {
        ctx.fillStyle = '#a1c4fd'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#a1c4fd'); grad.addColorStop(1, '#c2e9fb');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
        skyDetails.forEach(s => {
            s.x -= s.speed; if (s.x < cameraX - 100) s.x = cameraX + canvas.width + 100;
            if (s.type === 'cloud') {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.fillRect(s.x - cameraX, s.y, s.size * 2, s.size); ctx.fillRect(s.x - cameraX + s.size/2, s.y - s.size/2, s.size, s.size);
            } else {
                ctx.fillStyle = '#fff'; ctx.globalAlpha = Math.sin(Date.now()/200 + s.x) * 0.5 + 0.5;
                ctx.fillRect(s.x - cameraX, s.y, 4, 4); ctx.globalAlpha = 1;
            }
        });
        scenery.forEach(s => {
            ctx.save(); ctx.translate(s.x - cameraX, s.y);
            if (s.type === 'bottle') { ctx.fillStyle = COLORS.rhodeGray; ctx.fillRect(0, 0, 15, 30); ctx.fillStyle = '#fff'; ctx.fillRect(2, -5, 11, 5); }
            else { ctx.fillStyle = '#fff'; ctx.fillRect(5, 0, 5, 40); ctx.fillStyle = '#ffc0cb'; ctx.fillRect(-5, -15, 25, 25); }
            ctx.restore();
        });
        ctx.fillStyle = COLORS.ground; ctx.fillRect(0, canvas.height - GROUND_HEIGHT, canvas.width, GROUND_HEIGHT);
        drawGoal();
        ctx.fillStyle = '#ff69b4';
        bullets.forEach(b => { ctx.fillRect(b.x - cameraX, b.y, b.width, b.height); });
        sparkles.forEach(s => {
            ctx.fillStyle = `rgba(255, 255, 255, ${s.life})`;
            ctx.fillRect(s.x - cameraX, s.y, s.size, s.size);
        });
        obstacles.forEach(obs => {
            ctx.fillStyle = obs.hp > 1 ? '#555' : '#ff0000';
            ctx.font = '8px "Press Start 2P"'; ctx.fillText(obs.text, obs.x - cameraX, obs.y);
            ctx.fillStyle = '#ff69b4'; ctx.fillRect(obs.x - cameraX, obs.y + 5, (obs.hp/3) * obs.width, 3);
        });
        drawPlayer();
        if (!gameOver) requestAnimationFrame(draw);
    }

    setInterval(update, 1000/60);
    initLevel();
    draw();

</script>
</body>
</html>
