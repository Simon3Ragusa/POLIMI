<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashRL - Professor Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@700&display=swap');

        :root {
            --primary-color: #4caf50;
            --bg-dark: #0a0a0a;
            --card-bg: #141414;
            --text-main: #d1d1d1;
            --text-accent: #a5d6a7;
        }

        body { 
            font-family: 'Libre Baskerville', serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            background: var(--bg-dark); 
            color: var(--text-main); 
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--primary-color);
            margin-bottom: 5px;
            font-size: 2.5rem;
            text-align: center;
        }

        #professor-tag {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 20px;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-align: center;
        }

        #card-container { 
            perspective: 1200px; 
            width: 750px; 
            height: 450px; 
            max-width: 95vw;
        }
        
        #card { 
            width: 100%; 
            height: 100%; 
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); 
            transform-style: preserve-3d; 
            cursor: pointer; 
            position: relative; 
        }
        
        #card.flipped { transform: rotateY(180deg); }
        
        .card-face { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            padding: 40px; 
            box-sizing: border-box; 
            border-radius: 8px; 
            box-shadow: 0 15px 50px rgba(0,0,0,0.8); 
            text-align: center; 
            border: 1px solid #222;
            overflow-y: auto;
        }
        
        .front { 
            background: var(--card-bg); 
            font-size: 1.5rem; 
            color: #fff;
            border-bottom: 4px solid #2e7d32;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .back { 
            background: var(--card-bg); 
            transform: rotateY(180deg); 
            color: var(--text-accent); 
            font-size: 1.1rem; 
            text-align: left; 
            line-height: 1.6;
            scrollbar-width: thin;
            scrollbar-color: #333 var(--card-bg);
        }

        .back p { margin-top: 0; }

        .controls { 
            margin-top: 40px; 
            display: flex; 
            gap: 15px; 
            align-items: center; 
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button { 
            padding: 12px 24px; 
            border: 1px solid #444; 
            border-radius: 4px; 
            background: transparent; 
            color: #888; 
            cursor: pointer; 
            font-family: inherit;
            font-size: 1rem; 
            transition: all 0.2s; 
            min-width: 100px;
        }
        
        button:hover { 
            border-color: var(--primary-color); 
            color: #fff; 
            background: rgba(76, 175, 80, 0.1);
        }
        
        #progress { 
            color: #555; 
            font-size: 0.9rem; 
            margin-top: 15px; 
            font-family: monospace; 
        }

        .topic-indicator {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 0.75rem;
            color: #666;
            font-style: italic;
        }

        .yana-badge {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 0.65rem;
            background: #2e7d32;
            color: #fff;
            padding: 2px 10px;
            border-radius: 12px;
            font-family: sans-serif;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Mobile Specific Adjustments */
        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            #card-container { height: 400px; }
            .card-face { padding: 25px; }
            .front { font-size: 1.2rem; }
            .back { font-size: 0.95rem; }
            button { 
                padding: 15px 30px; 
                font-size: 1.1rem; 
                flex: 1 1 auto;
                max-width: 150px;
            }
            .controls { gap: 10px; width: 100%; max-width: 400px; }
            .yana-badge { top: 10px; left: 10px; font-size: 0.6rem; }
            .topic-indicator { top: 10px; right: 10px; font-size: 0.65rem; }
        }
    </style>
</head>
<body>

        var cards = [];
        var index = 0;

        function shuffleDeck() {
            cards = originalCards.slice();
            for (var i = cards.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = cards[i];
                cards[i] = cards[j];
                cards[j] = temp;
            }
            index = 0;
            render();
        }

        function render() {
            if (cards.length === 0) return;
            var card = cards[index];
            document.getElementById('professor-tag').innerText = 'Examiner: Prof. ' + card.prof;
            document.getElementById('topic-front').innerText = card.topic;
            document.getElementById('question-text').innerText = card.question;
            document.getElementById('answer-text').innerHTML = '<p>' + card.answer + '</p>';
            document.getElementById('progress').innerText = (index + 1) + ' / ' + cards.length;
            document.getElementById('card').classList.remove('flipped');
            
            // Show/Hide Yana Badge
            document.getElementById('yana-badge').style.display = card.yana ? 'block' : 'none';
        }

        document.getElementById('card').onclick = function() {
            document.getElementById('card').classList.toggle('flipped');
        };

        document.getElementById('next').onclick = function(e) {
            e.stopPropagation();
            index = (index + 1) % cards.length;
            render();
        };

        document.getElementById('prev').onclick = function(e) {
            e.stopPropagation();
            index = (index - 1 + cards.length) % cards.length;
            render();
        };

        document.getElementById('shuffle').onclick = function(e) {
            e.stopPropagation();
            shuffleDeck();
        };

        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') document.getElementById('card').click();
            if (e.code === 'ArrowRight') document.getElementById('next').click();
            if (e.code === 'ArrowLeft') document.getElementById('prev').click();
            if (e.code === 'KeyR') shuffleDeck();
        });

        shuffleDeck();
    </script>
